<!DOCTYPE html>
<html lang="es">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM TiendaZapas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div class="header__top"> 
      <img src="img/imgzapnn.png" alt="Logo" class="header__logo-img">
    </div>

    <nav class="header__nav">
      <button class="header__btn header__btn--activo" data-seccion="clientes">Clientes</button>
      <button class="header__btn" data-seccion="productos">Productos</button>
      <button class="header__btn" data-seccion="ventas">Ventas</button>
      <button class="header__btn" data-seccion="usuarios">Usuarios</button>
    </nav>

  </header>

  <main class="main">

    <div class="toast" id="toast"></div>

    <div class="modal" id="modal">
      <div class="modal__contenido">

        <div class="modal__header">
          <h2 id="modal-title"></h2>
          <button id="modal-close" class="modal__cerrar">✕</button>
        </div>

        <div class="modal__body" id="modal-body"></div>

        <div class="modal__footer">
          <button id="modal-cancel" class="btn btn--secundario">Cancelar</button>
          <button id="modal-save" class="btn btn--principal">Guardar</button>
        </div>

      </div>
    </div>

    <section class="seccion" id="seccion-clientes">

      <div class="seccion__top">
        <div>
          <h2 class="seccion__titulo">Clientes</h2>
          <p class="seccion__texto" id="clientes-count">0 clientes</p>
        </div>

        <button class="btn btn--principal" id="btn-nuevo-cliente">+ Nuevo cliente</button>
      </div>

      <div class="buscador">
        <input type="text" id="buscar-cliente" class="buscador__input" placeholder="Buscar...">
      </div>

      <div class="tabla-box">
        <table class="tabla">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Dirección</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-clientes"></tbody>
        </table>
      </div>

    </section>

    <section class="seccion seccion--oculta" id="seccion-productos">

      <div class="seccion__top">
        <div>
          <h2 class="seccion__titulo">Productos</h2>
          <p class="seccion__texto" id="productos-count">0 productos</p>
        </div>

        <button class="btn btn--principal" id="btn-nuevo-producto">+ Nuevo producto</button>
      </div>

      <div class="buscador">
        <input type="text" id="buscar-producto" class="buscador__input" placeholder="Buscar...">
      </div>

      <div class="tabla-box">
        <table class="tabla">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Marca</th>
              <th>Talla</th>
              <th>Color</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Categoría</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos"></tbody>
        </table>
      </div>

    </section>

    <!-- VENTAS -->
    <section class="seccion seccion--oculta" id="seccion-ventas">

      <div class="seccion__top">
        <div>
          <h2 class="seccion__titulo">Ventas</h2>
          <p class="seccion__texto" id="ventas-count">0 ventas</p>
        </div>

        <button class="btn btn--principal" id="btn-nueva-venta">+ Nueva venta</button>
      </div>

      <div class="stats" id="stats-ventas"></div>

      <div class="tabla-box">
        <table class="tabla">
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Vendedor</th>
              <th>Estado</th>
              <th>Total</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-ventas"></tbody>
        </table>
      </div>

    </section>


    <section class="seccion seccion--oculta" id="seccion-usuarios">

      <div class="seccion__top">
        <div>
          <h2 class="seccion__titulo">Usuarios</h2>
          <p class="seccion__texto" id="usuarios-count">0 usuarios</p>
        </div>

        <button class="btn btn--principal" id="btn-nuevo-usuario">+ Nuevo usuario</button>
      </div>

      <div class="tabla-box">
        <table class="tabla">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios"></tbody>
        </table>
      </div>

    </section>

  </main>

  <footer class="footer">
    <p class="footer__texto">Zapnn (Marca registrada)</p>
  </footer>

  <script src="app.js"></script>

</body>

</html>
